<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girish IDE</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/monaco-editor@0.44.0/min/vs/loader.js"></script>
</head>

<body class="ide-page">
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="logo">
                    <img src="Gemini_Generated_Image_cw7rh8cw7rh8cw7r.png" alt="Girish IDE" class="logo-icon">
                    Girish IDE
                </h1>
                <nav class="main-nav">
                    <a href="index.html" class="nav-link active">Home</a>
                    <a href="about.html" class="nav-link">About Us</a>
                </nav>
                <div class="header-controls">
                    <button id="themeToggle" class="theme-toggle" title="Toggle theme">
                        <svg class="theme-icon sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <circle cx="12" cy="12" r="5" />
                            <path
                                d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
                        </svg>
                        <svg class="theme-icon moon-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                        </svg>
                    </button>
                    <div class="social-links">
                        <a href="https://www.instagram.com/girish_lade_/" target="_blank" title="Instagram">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect width="20" height="20" x="2" y="2" rx="5" ry="5"/>
                                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
                                <line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/>
                            </svg>
                        </a>
                        <a href="https://www.linkedin.com/in/girish-lade-075bba201/" target="_blank" title="LinkedIn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/>
                                <rect width="4" height="12" x="2" y="9"/>
                                <circle cx="4" cy="4" r="2"/>
                            </svg>
                        </a>
                        <a href="https://github.com/girishlade111" target="_blank" title="GitHub">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/>
                                <path d="M9 18c-4.51 2-5-2-7-2"/>
                            </svg>
                        </a>
                        <a href="https://codepen.io/Girish-Lade-the-looper" target="_blank" title="CodePen">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polygon points="12,2 22,8.5 22,15.5 12,22 2,15.5 2,8.5"/>
                                <line x1="12" x2="12" y1="22" y2="15.5"/>
                                <polyline points="22,8.5 12,15.5 2,8.5"/>
                                <polyline points="2,15.5 12,8.5 22,15.5"/>
                                <line x1="12" x2="12" y1="2" y2="8.5"/>
                            </svg>
                        </a>
                        <a href="mailto:girishlade111@gmail.com" title="Email">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                                <polyline points="22,6 12,13 2,6"/>
                            </svg>
                        </a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Prompt Section -->
            <div class="prompt-section">
                <div class="prompt-container">
                    <div class="prompt-input-wrapper">
                        <textarea id="promptInput" placeholder="Describe the website you want to create or modify existing one..."
                            rows="3"></textarea>
                        <div class="prompt-actions">
                            <button id="enhanceBtn" class="enhance-btn">
                                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 0 1-.659 1.591l-5.432 5.432a2.25 2.25 0 0 0-.659 1.591v2.927a2.25 2.25 0 0 1-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 0 0-.659-1.591L3.659 7.409A2.25 2.25 0 0 1 3 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0 1 12 3Z"/>
                                </svg>
                                Enhance Prompt
                            </button>
                            <button id="generateBtn" class="generate-btn">
                                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
                                    <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
                                    <circle cx="18" cy="6" r="3"/>
                                </svg>
                                <span id="generateBtnText">Generate Website</span>
                            </button>
                            <button id="updateBtn" class="update-btn hidden">
                                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 4v6h6" />
                                    <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
                                </svg>
                                Update Website
                            </button>
                        </div>
                        <div class="prompt-mode-indicator">
                            <span id="modeIndicator" class="mode-indicator">Create Mode</span>
                            <button id="clearBtn" class="clear-btn hidden">
                                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                                </svg>
                                Clear & Start New
                            </button>
                        </div>
                    </div>
                </div>

                <!-- History Section -->
                <div class="history-section" id="historySection">
                    <div class="history-tabs">
                        <button class="history-tab active" data-tab="prompts">Prompt History</button>
                        <button class="history-tab" data-tab="code">Code History</button>
                    </div>
                    <div class="history-content">
                        <div id="promptHistory" class="history-panel active"></div>
                        <div id="codeHistory" class="history-panel"></div>
                    </div>
                </div>
            </div>

            <!-- Output Section -->
            <div class="output-section">
                <div class="output-tabs">
                    <button class="output-tab active" data-tab="preview">
                        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                        Live Preview
                    </button>
                    <button class="output-tab" data-tab="code">
                        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="16,18 22,12 16,6" />
                            <polyline points="8,6 2,12 8,18" />
                        </svg>
                        Code
                    </button>
                </div>

                <div class="output-content">
                    <div id="previewPanel" class="output-panel active">
                        <iframe id="previewFrame"
                            sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"
                            style="border: none; width: 100%; height: 100%; background: white;"
                            referrerpolicy="no-referrer"></iframe>
                    </div>
                    <div id="codePanel" class="output-panel">
                        <div id="monacoEditor"></div>
                    </div>
                </div>
            </div>
        </main>



        <!-- Loading Overlay -->
        <div id="loadingOverlay" class="loading-overlay hidden">
            <div class="loading-content">
                <div class="spinner"></div>
                <p id="loadingText">Generating your website...</p>
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
